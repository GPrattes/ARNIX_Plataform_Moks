name: ARNIX Research & Validation Engine — CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: 🛡️ Code Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências do Forms
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest httpx

      - name: Validar Sintaxe & Compilação Python
        run: |
          python -m py_compile backend/server.py
          python -m py_compile backend/db.py
          python -m py_compile backend/notifier.py
          python -m py_compile api/index.py
