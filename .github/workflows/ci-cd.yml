        uses: actions/checkout@v4

      - name: Validar Assets Estáticos
        run: |
          echo "Iniciando pipeline para o ambiente de Mock Estático..."
          echo "Validando estrutura de arquivos em web/ (HTML, CSS, JS)..."
          ls -la
          echo "Validação concluída. Nenhum backend Python necessário."
